[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lrdmem"
version = "0.1.0"
description = "Shared git-backed memory store for AI coding agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Victor Larodiel" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/larodiel/lrdmem"

[project.scripts]
lrdmem = "lrdmem.cli:main"

[tool.setuptools]
packages = ["lrdmem", "lrdmem.hooks"]

[tool.setuptools.package-data]
lrdmem = ["skill/*", "hooks/*.js"]
